<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="64" viewBox="0 0 900 64" role="img" aria-labelledby="t d">
  <title id="t">Proyectos destacados</title>
  <desc id="d">Sección 05: Proyectos destacados</desc>
  <style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

    .sweep { animation: sweep 4.5s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-140px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(381px); opacity: 0; } }
    .num { animation: hue 6s ease-in-out infinite; }
    @keyframes hue { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
  </style>
  <defs>
  <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/>
    <stop offset="1" stop-color="#0A1128"/>
  </linearGradient>
  <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111B38"/>
    <stop offset="1" stop-color="#0C142B"/>
  </linearGradient>
  <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58A6FF"/>
    <stop offset="0.5" stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="g-stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58A6FF" stop-opacity="0.55"/>
    <stop offset="0.5" stop-color="#1D2A4D" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0.55"/>
  </linearGradient>
  <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

    <linearGradient id="hl" x1="0" x2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1D2A4D" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sw" x1="0" x2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lc"><rect x="364" y="27" width="381" height="10"/></clipPath>
  </defs>

  <rect x="1" y="4" width="898" height="56" rx="14" fill="url(#g-panel)" stroke="url(#g-stroke)"/>
  <rect x="12" y="13" width="62" height="38" rx="10" fill="#050816" stroke="#1D2A4D"/>
  <text x="43" y="38.5" text-anchor="middle" font-size="18" font-weight="700" class="mono num" fill="url(#g-brand)">05</text>
  <text x="92" y="40" font-size="22" font-weight="700" fill="#E6EDF3">Proyectos destacados</text>
  <rect x="364" y="31.25" width="381" height="1.5" fill="url(#hl)"/>
  <g clip-path="url(#lc)"><rect x="364" y="30.25" width="140" height="3.5" rx="2" fill="url(#sw)" class="sweep"/></g>
  <text x="878" y="36" text-anchor="end" font-size="12" class="mono" fill="#5F6C88">// ls ./projects</text>
  
</svg>
