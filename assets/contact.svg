  <circle cx="770" cy="100" r="56" fill="none" stroke="#58A6FF" stroke-width="1.5" class="wave" style="animation-delay:0s"/><circle cx="770" cy="100" r="56" fill="none" stroke="#58A6FF" stroke-width="1.5" class="wave" style="animation-delay:1s"/><circle cx="770" cy="100" r="56" fill="none" stroke="#58A6FF" stroke-width="1.5" class="wave" style="animation-delay:2s"/>
