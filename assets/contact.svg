  </filter>
  <filter id="f-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

    <radialGradient id="cg" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1C7ED6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1C7ED6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="199" rx="22" fill="url(#g-panel)" stroke="url(#g-stroke)"/>
