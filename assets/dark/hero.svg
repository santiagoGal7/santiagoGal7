  .in { animation: in .7s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

    
  .blink { animation: blink 1.05s steps(1, end) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    .req { animation: req 3.6s linear infinite; }
    @keyframes req {
      0% { transform: translateY(0); opacity: 0; }
      6% { opacity: 1; }
      62% { transform: translateY(156px); opacity: 1; }
      68%, 100% { transform: translateY(156px); opacity: 0; }
    }
  </style>
