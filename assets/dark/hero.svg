  <title id="t">Santiago Gallo — Backend Developer en Colombia</title>
  <desc id="d">Construyo APIs y backends que resuelven problemas reales. Stack: .NET, Python, JavaScript, PostgreSQL y agentes de IA.</desc>
  <style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
