<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="446" height="256" viewBox="0 0 446 256" role="img" aria-labelledby="t d">
  <title id="t">Evaluador de hojas de vida</title>
  <desc id="d">Analiza un CV en PDF frente a una vacante y estima la afinidad. Corre en local con Ollama o en la nube con Google Gemini. Tecnologías: Python, Streamlit, Ollama, Gemini.</desc>
  <style>
  text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .draw { stroke-dasharray: 1; animation: draw 1.1s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  .in { animation: in .7s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
