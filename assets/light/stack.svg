  <desc id="d">Backend: C#, .NET 10, ASP.NET Core, EF Core, MediatR, FluentValidation, Clean Arch., Python. Calidad y seguridad: JWT, Swagger, xUnit. Datos: PostgreSQL, Supabase, Google Sheets. Frontend: JavaScript, TypeScript, React, Next.js, Vite, Tailwind, HTML, CSS. IA y automatización: n8n, Ollama, Gemini, Streamlit, Telegram Bots. DevOps y herramientas: Node.js, Docker, Git, GitHub Actions, Netlify.</desc>
