<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Cómo construyo un backend</title>
  <desc id="d">Clientes web, bots y Swagger llaman a una API en ASP.NET Core con autenticación JWT y Clean Architecture (Presentation, Application, Domain, Infrastructure), que persiste en PostgreSQL con EF Core y se integra con un agente de IA en Python y flujos de n8n.</desc>
