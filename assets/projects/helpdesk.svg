  <title id="t">HelpDesk Backend — proyecto destacado</title>
  <desc id="d">API REST para mesa de ayuda: tickets, usuarios, roles, asignaciones, alertas y reportes. Autenticación JWT con refresh tokens y pruebas unitarias y de integración. Tecnologías: .NET 10, ASP.NET Core, EF Core, PostgreSQL, MediatR, FluentValidation, xUnit.</desc>
